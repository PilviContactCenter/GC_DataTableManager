services:
  web:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.datatable-manager.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)
      - traefik.http.routers.datatable-manager.entrypoints=websecure
      - traefik.http.routers.datatable-manager.tls.certresolver=letsencrypt
      - traefik.http.services.datatable-manager.loadbalancer.server.port=80
    networks:
      - default
      - traefik_default

networks:
  traefik_default:
    external: true
